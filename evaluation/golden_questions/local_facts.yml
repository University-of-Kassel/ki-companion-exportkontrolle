questions:
- id: local_facts_001
  topic: Zuständigkeit
  fixture: institution.test
  question: Wer ist an der Beispieluniversität für Exportkontrolle zuständig?
  expected_behavior:
  - Nennt Exportkontrollstelle der Beispieluniversität als zuständige Stelle.
  setup_note: Nur auf isoliertem Testprofil aus evaluation/fixtures/institution.test.json, gebaut mit --mode review
    --allow-test-fixture. Namen, Rollen und .invalid-Adressen sind ausdrücklich synthetische Sollwerte; niemals
    im Produktivprofil verwenden. Prüft die Auskunft, nicht den RAG-Abruf.
